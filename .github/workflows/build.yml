# Compila el instalador de Windows (.exe) en GitHub sin tener que instalar Rust en tu PC.
# Súbelo a un repo, ve a Actions -> "Compilar instalador" -> Run workflow,
# y descarga el artefacto "Optimizador-setup" cuando termine (~10 min la primera vez).
name: Compilar instalador

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run tauri build

      - uses: actions/upload-artifact@v7
        with:
          name: GhostNet-Optimizer-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
